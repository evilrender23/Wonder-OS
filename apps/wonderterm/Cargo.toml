[package]
name = "wonderterm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "WonderlandWM's terminal: animated cursor, tabs, Hermes palette"

[dependencies]
alacritty_terminal = "0.26"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
